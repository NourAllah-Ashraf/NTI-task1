<!DOCTYPE html>
<html>
    <div class="container">
    <head>
        <link rel="stylesheet" href="nn.css">

    </head>
    <body>
        <div class="box1">
            <h2>let's chat</h2>
        <p>
            whether you have a questions, want to
         start a project or simply want to connect
        </p>
        <p>
            feel free to send me a message in the
                       contact form  
        </p>
        </div>
        <div class="box2">
            <h1>contact</h1>
            <p class="required-text">* Required</p>
            <form class="contact-form" method="post">
                
                <label for="name"></label><br>
                <input type="text" id="name" name="name" placeholder="Name*" required><br>

                <label for="email"></label><br>
                <input type="email" id="email" name="email" placeholder="Email*" required><br>

                <label for="company"></label><br>
                <input type="text" id="company"name="company" placeholder="Company*" required><br>

                <label for="phone"></label><br>
                <input type="text" id="phone" name="phone" pattern="^\d{11}$" title="Please enter exactly 11 numbers"  placeholder="Phone*" required><br>


                <label for="message"></label><br>
                <textarea id="message" name="message" placeholder="Message"></textarea><br>
                <br></br>
                <button type="submit">SUBMIT</button>
            </form>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

        </div>
        

    </body>
    </div>

</html>
